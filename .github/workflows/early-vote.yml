name: Early vote (every 3 hours)

# Pulls the UF Election Lab early vote file (CC BY-NC-ND 4.0, credit required)
# and writes data/early-vote.json plus a daily history for early-vote.html.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-early-vote.js"

concurrency:
  group: early-vote
  cancel-in-progress: false

jobs:
  refresh-early-vote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch early vote file
        run: node scripts/fetch-early-vote.js
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/early-vote.json data/early-vote-history.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Early vote: refresh"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
