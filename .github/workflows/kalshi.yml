name: Kalshi Market Prices (30-min refresh)

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

jobs:
  refresh-kalshi:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Kalshi market prices
        run: node scripts/scrape-kalshi.js

      - name: Commit refreshed prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/kalshi
          git diff --staged --quiet || git commit -m "Kalshi: refresh market prices"
          git pull --rebase origin main
          git push
