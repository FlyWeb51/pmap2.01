name: Kalshi Market Prices

on:
  schedule:
    # Off the top of the hour on purpose: GitHub delays or drops scheduled
    # runs at :00 and :30 when its queue is busy, which is why the old
    # "*/30" job was really running every 3 to 7 hours.
    - cron: "13,43 * * * *"
  workflow_dispatch:

concurrency:
  group: kalshi
  cancel-in-progress: false

jobs:
  refresh-kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Kalshi market prices
        run: node scripts/scrape-kalshi.js

      - name: Rebuild national overview data
        run: node scripts/build-overview.js

      - name: Commit refreshed prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/kalshi data/overview.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Kalshi: refresh market prices"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
